<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Busca Campinas - Encontre serviços, produtos e comércios locais em Campinas."
    >

    <title>Busca Campinas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="phone-frame">

        <section class="screen active">

            <!-- LOGO -->
            <header class="logo-area">
                <img
                    src="img/logo.png"
                    alt="Busca Campinas"
                >
            </header>


            <!-- BUSCA -->
            <form class="search-container">

                <label
                    for="searchInput"
                    class="sr-only"
                >
                    O que você procura?
                </label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="O que você procura?"
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="search-button"
                    aria-label="Pesquisar"
                    title="Pesquisar"
                >

                    <!-- Ícone de lupa -->
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="6.5"
                        ></circle>

                        <line
                            x1="16"
                            y1="16"
                            x2="21"
                            y2="21"
                        ></line>

                    </svg>

                </button>

            </form>


            <!-- CATEGORIAS -->
            <nav class="home-buttons" aria-label="Categorias">

                <!-- SERVIÇOS -->
                <button
                    type="button"
                    class="main-button"
                >

                    <svg
                        class="button-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M14.7 6.3a4.5 4.5 0 0 0-5.8 5.8L3.5 17.5a2.1 2.1 0 0 0 3 3l5.4-5.4a4.5 4.5 0 0 0 5.8-5.8l-3.1 3.1-2.4-2.4 3.1-3.1a4.5 4.5 0 0 0-.6-.6Z"
                        ></path>
                    </svg>

                    <span>Serviços</span>

                </button>


                <!-- PRODUTOS -->
                <button
                    type="button"
                    class="main-button"
                >

                    <svg
                        class="button-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M6 8h12l1 13H5L6 8Z"
                        ></path>

                        <path
                            d="M9 8a3 3 0 0 1 6 0"
                        ></path>

                    </svg>

                    <span>Produtos</span>

                </button>


                <!-- COMÉRCIO LOCAL -->
                <button
                    type="button"
                    class="main-button"
                >

                    <svg
                        class="button-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M4 10h16"
                        ></path>

                        <path
                            d="M5 10v10h14V10"
                        ></path>

                        <path
                            d="M3 10l2-6h14l2 6"
                        ></path>

                        <path
                            d="M8 20v-6h8v6"
                        ></path>

                    </svg>

                    <span>Comércio Local</span>

                </button>

            </nav>


            <!-- LINKS INFERIORES -->
            <footer class="bottom-links">

                <a href="#">
                    Anuncie Grátis
                </a>

                <a href="#">
                    Login
                </a>

            </footer>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
